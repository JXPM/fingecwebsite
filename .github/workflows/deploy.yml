name: Deploiement VPS

# Deploiement continu : a chaque push sur main, on se connecte au VPS en SSH
# et on met a jour le conteneur (git pull + rebuild). Declenchable aussi a la main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preparer la cle SSH et known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deployer sur le VPS
        run: |
          ssh -i ~/.ssh/id_ci -o ConnectTimeout=20 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -e; cd /opt/fingec-site \
              && git fetch --prune origin \
              && git reset --hard origin/main \
              && docker compose up -d --build \
              && docker image prune -f'

      - name: Verifier que le site repond
        run: |
          ssh -i ~/.ssh/id_ci -o ConnectTimeout=20 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'docker run --rm --network pharmaclick_web curlimages/curl:latest \
              -s -o /dev/null -w "fingec-site: HTTP %{http_code}\n" \
              --max-time 15 http://fingec-site:3000'
