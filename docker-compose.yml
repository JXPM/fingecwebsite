services:
  web:
    build:
      context: .
      args:
        # Variables publiques injectees au build (cf. .env)
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
    image: fingec-web
    container_name: fingec-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env

